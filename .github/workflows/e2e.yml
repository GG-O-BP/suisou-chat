name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22.11.0"
          cache: npm
      - name: Install Tauri and WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb
      - name: Install Rust build tools
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.11.4 --locked
      - run: npm ci
      - run: npm run e2e:doctor
      - run: npm audit --omit=dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run e2e:browser
      - run: npm run e2e:performance
      - name: Native Tauri E2E
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run e2e:native
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          if-no-files-found: ignore
