[package]
name = "suisou-chat-ui"
version = "0.1.0"
description = "A local-first research workspace powered by Sakana Fugu"
authors = ["Suisou contributors"]
edition = "2021"

[dependencies]
sycamore = { version = "0.9", features = ["suspense"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "Document",
  "EventTarget",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Navigator",
  "Url",
  "Window",
] }

[workspace]
members = ["src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
