[build]
target = "./index.html"
dist = "dist"
public_url = "/"
filehash = true
# Trunk computes file names and SRI before post-build hooks run. Keep the
# generated module untouched so the integrity recorded in index.html always
# matches the JavaScript shipped in desktop and mobile bundles.
#
# Trunk 0.21.14's bundled minifier cannot parse the ESM emitted by the current
# wasm-bindgen version, so JavaScript minification stays disabled for now.
minify = "never"

[watch]
ignore = ["./src-tauri"]

[serve]
port = 1420
open = false
