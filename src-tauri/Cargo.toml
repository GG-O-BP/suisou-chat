[package]
name = "suisou-chat"
version = "0.1.0"
description = "A local-first research workspace powered by Sakana Fugu"
authors = ["Suisou contributors"]
edition = "2021"

[lib]
name = "suisou_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros"] }
tokio-util = "0.7"
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
